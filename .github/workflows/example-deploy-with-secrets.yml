name: Example Deploy (uses repo secrets)

on:
  workflow_dispatch:
  workflow_call:
    secrets:
      MINIO_ACCESS_KEY:
        required: false
      MINIO_SECRET_KEY:
        required: false
      MINIO_ENDPOINT:
        required: false
      POSTGRES_PASSWORD:
        required: false
      EMAIL_HOST_PASSWORD:
        required: false
      SECRET_KEY:
        required: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      MINIO_ACCESS_KEY: ${{ secrets.MINIO_ACCESS_KEY }}
      MINIO_SECRET_KEY: ${{ secrets.MINIO_SECRET_KEY }}
      MINIO_ENDPOINT: ${{ secrets.MINIO_ENDPOINT }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      EMAIL_HOST_PASSWORD: ${{ secrets.EMAIL_HOST_PASSWORD }}
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show safe env variables (no secrets printed)
        run: |
          echo "MINIO_ENDPOINT=$MINIO_ENDPOINT"
          echo "Using MINIO access key from secrets (not printed)"

      - name: Example deploy step
        run: |
          # Place your deploy commands here. Example: build and push image, then run deploy.
          echo "Deploy steps go here"

      - name: Run smoke test (optional)
        run: |
          # Example: run a smoke test script that reads the env vars
          python scripts/smoke_minio.py
        env:
          MINIO_ACCESS_KEY: ${{ secrets.MINIO_ACCESS_KEY }}
          MINIO_SECRET_KEY: ${{ secrets.MINIO_SECRET_KEY }}
          MINIO_ENDPOINT: ${{ secrets.MINIO_ENDPOINT }}
