name: Deploy CinemaSavvy

on:
  push:
    branches:
      - main
      - fix/lint-build
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Lightsail
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to server
        run: |
          ssh -i ~/.ssh/id_rsa ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'ENDSSH'
            set -e
            cd /home/ubuntu/CinemaSavvy
            git remote set-url origin https://${{ secrets.GIT_TOKEN }}@github.com/Aazizbek1212/CinemaSavvy.git
            DEPLOY_BRANCH='${{ github.ref_name }}'
            git fetch --prune origin "$DEPLOY_BRANCH"
            git checkout -B "$DEPLOY_BRANCH" "origin/$DEPLOY_BRANCH"
            git reset --hard "origin/$DEPLOY_BRANCH"
            docker compose up -d --build
            docker compose restart
            DB_USER="$(docker compose exec -T db printenv POSTGRES_USER | tr -d '\r\n')"
            DB_PASSWORD="$(docker compose exec -T db printenv POSTGRES_PASSWORD | tr -d '\r\n')"
            docker compose exec -T -u postgres db psql -v ON_ERROR_STOP=1 -d postgres \
              -v db_user="$DB_USER" -v db_password="$DB_PASSWORD" \
              -c "SELECT format('ALTER ROLE %I PASSWORD %L', :'db_user', :'db_password') \\gexec"
            docker compose exec -T web python manage.py migrate --noinput
            docker compose exec -T web python manage.py collectstatic --noinput
            docker image prune -f
            echo "Deploy muvaffaqiyatli!"
          ENDSSH